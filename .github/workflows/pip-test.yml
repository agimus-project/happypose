name: Tests with pip

on:
  push:
    branches:
    - dev
  pull_request:
    branches:
    - dev

jobs:
  pip:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install apt deps
        run: |
          sudo apt-get update
          # deps for Panda3D renderer
          sudo apt-get install -qqy libegl1-mesa-dev
          # deps for pillow
          sudo apt-get install -y -qq libjpeg-dev

      - name: Caching of the happypose installation and data
        uses: actions/cache@v4
        with:
          path: local_data
          key: data

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Update pip
        run: pip install -U pip

      - name: Install happypose
        run: pip install -r requirements/cpu.txt -r requirements/pypi.txt

      - name: Download pre-trained models required for tests
        run: |
          mkdir -p local_data
          python -m happypose.toolbox.utils.download \
            --megapose_models \
            --examples \
              barbecue-sauce \
            --cosypose_models  \
              detector-bop-hope-pbr--15246 \
              coarse-bop-hope-pbr--225203 \
              refiner-bop-hope-pbr--955392

      - name: Run tests
        run: |
          set -x
          python -m unittest
          for test in tests/test_*.py; do
            grep -q pytest $test && pytest tests -v $test
          done
